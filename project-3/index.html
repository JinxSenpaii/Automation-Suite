<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project 3 — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.16), transparent 45%), #0b0a16;
      color: #f4f4f8;
      font-family: 'Inter', system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 32px 26px;
      border-radius: 20px;
      background: rgba(20, 18, 38, 0.88);
      border: 1px solid rgba(167, 139, 250, 0.28);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .tag {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a78bfa;
      background: rgba(139, 92, 246, 0.16);
      border: 1px solid rgba(167, 139, 250, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 { font-size: clamp(24px, 4vw, 30px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; }
    p { font-size: 14px; color: #a5a3c2; line-height: 1.6; }
    code { font-family: 'JetBrains Mono', monospace; color: #c4b5fd; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">AI AUTOMATION · NEXT PROJECT</div>
    <h1>Project 3 — Coming Soon</h1>
    <p>
      This slot is pre-wired into your responsive sidebar hub with its own indigo/violet theme. Drop your next project into <code>project-3/index.html</code> and update the <code>PROJECTS</code> array in the root <code>index.html</code>.
    </p>
  </div>
</body>
</html>
