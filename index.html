<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Abdelrahman Mohamed — AI Automation Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --side-bg: #0b0b0e;
      --side-elev: #121218;
      --side-border: rgba(255, 77, 0, 0.25);
      --side-text: #f4f4f5;
      --side-muted: #9ca3af;
      --accent: #ff4d00;
      --accent-soft: rgba(255, 77, 0, 0.15);
      --accent-glow: rgba(255, 77, 0, 0.35);
      --hover-bg: rgba(255, 255, 255, 0.05);
      --side-w: 268px;
      --side-w-collapsed: 72px;
      --mobile-bar-h: 54px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--side-bg);
      color: var(--side-text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      transition: background 0.28s ease;
    }

    .shell {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Mobile Top Bar */
    .mobile-bar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--mobile-bar-h);
      background: var(--side-bg);
      border-bottom: 1px solid var(--side-border);
      padding: 0 12px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 60;
      transition: background 0.28s ease, border-color 0.28s ease;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--side-text);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 18px;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .mobile-active {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      justify-content: center;
    }

    .mobile-active-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      flex-shrink: 0;
      transition: background 0.28s ease, box-shadow 0.28s ease;
    }

    /* Sidebar */
    .sidebar {
      width: var(--side-w);
      flex-shrink: 0;
      height: 100%;
      background: var(--side-bg);
      border-right: 1px solid var(--side-border);
      display: flex;
      flex-direction: column;
      z-index: 80;
      transition: width 0.24s ease, transform 0.26s ease, background 0.28s ease, border-color 0.28s ease;
      overflow: hidden;
    }

    .shell.collapsed .sidebar { width: var(--side-w-collapsed); }

    .side-head {
      padding: 16px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 66px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      text-decoration: none;
      color: var(--side-text);
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 0 16px -4px var(--accent-glow);
      transition: all 0.28s ease;
    }

    .brand-text { min-width: 0; transition: opacity 0.18s ease; }

    .brand-name {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--side-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .shell.collapsed .brand-text,
    .shell.collapsed .nav-section-label,
    .shell.collapsed .proj-meta,
    .shell.collapsed .subnav,
    .shell.collapsed .side-foot-text {
      display: none;
    }

    .shell.collapsed .side-head { justify-content: center; padding: 16px 8px; }
    .shell.collapsed .brand { display: none; }

    .collapse-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--side-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }

    .collapse-btn:hover {
      color: var(--side-text);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .close-drawer-btn { display: none; }

    .side-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--side-muted);
      padding: 4px 10px 6px;
    }

    .proj-group { display: flex; flex-direction: column; gap: 4px; }

    .proj-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 11px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--side-muted);
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      position: relative;
      transition: all 0.18s ease;
    }

    .shell.collapsed .proj-item { justify-content: center; padding: 10px; }

    .proj-item:hover { background: var(--hover-bg); color: var(--side-text); }

    .proj-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--side-text);
      box-shadow: 0 4px 18px -6px var(--accent-glow);
    }

    .proj-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .proj-meta { min-width: 0; flex: 1; }

    .proj-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .proj-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .proj-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      flex-shrink: 0;
    }

    .proj-desc {
      font-size: 11px;
      color: var(--side-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subnav {
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 2px 0 6px 26px;
      margin-left: 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .proj-group.active .subnav { display: flex; }

    .subnav-btn {
      background: transparent;
      border: none;
      color: var(--side-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .subnav-btn:hover { color: var(--side-text); background: var(--hover-bg); }
    .subnav-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

    .side-foot {
      padding: 12px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .foot-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.04);
      color: var(--side-text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.18s ease;
    }

    .foot-link:hover { border-color: var(--accent); background: var(--accent-soft); }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(3px);
      z-index: 70;
    }
    .backdrop.open { display: block; }

    /* Main Viewport */
    .stage {
      flex: 1;
      min-width: 0;
      height: 100%;
      position: relative;
      background: var(--side-bg);
    }

    .frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    .overlay-state {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--side-bg);
      z-index: 20;
    }
    .overlay-state.visible { display: flex; }

    .loader-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--side-muted);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .missing-card {
      max-width: 480px;
      width: 100%;
      padding: 28px 24px;
      border-radius: 16px;
      background: var(--side-elev);
      border: 1px solid var(--side-border);
      text-align: left;
    }

    .missing-card h2 { font-size: 18px; margin-bottom: 10px; }
    .missing-card p { font-size: 13.5px; color: var(--side-muted); line-height: 1.6; margin-bottom: 12px; }
    .missing-card code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent);
    }

    @media (max-width: 900px) {
      .mobile-bar { display: flex; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(290px, 84vw) !important;
        transform: translateX(-104%);
        box-shadow: 12px 0 40px rgba(0, 0, 0, 0.55);
      }

      .sidebar.open { transform: translateX(0); }

      .collapse-btn { display: none; }
      .close-drawer-btn { display: grid; }

      .shell.collapsed .brand,
      .shell.collapsed .brand-text,
      .shell.collapsed .nav-section-label,
      .shell.collapsed .proj-meta,
      .shell.collapsed .side-foot-text {
        display: initial;
      }
      .shell.collapsed .brand { display: flex; }
      .shell.collapsed .proj-group.active .subnav { display: flex; }

      .stage { padding-top: var(--mobile-bar-h); }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <!-- Mobile Top Bar -->
    <header class="mobile-bar">
      <button class="icon-btn" id="openDrawerBtn" aria-label="Open projects menu">☰</button>
      <div class="mobile-active">
        <span class="dot"></span>
        <span class="mobile-active-title" id="mobileTitle">Automation Suite</span>
      </div>
      <a class="icon-btn" id="mobileStandalone" href="./fenjan/index.html" target="_blank" rel="noopener" title="Open standalone">↗</a>
    </header>

    <div class="backdrop" id="backdrop"></div>

    <!-- Side Navigation Bar -->
    <aside class="sidebar" id="sidebar" aria-label="Projects and Workflows">
      <div class="side-head">
        <a class="brand" href="#/hr">
          <span class="brand-mark">AI</span>
          <div class="brand-text">
            <div class="brand-name">Abdelrahman</div>
            <div class="brand-sub">Automation Suite</div>
          </div>
        </a>
        <button class="collapse-btn" id="collapseBtn" title="Collapse / expand sidebar">«</button>
        <button class="icon-btn close-drawer-btn" id="closeDrawerBtn" aria-label="Close menu">✕</button>
      </div>

      <div class="side-scroll">
        <div class="nav-section-label">Projects &amp; Workflows</div>
        <div id="projectList"></div>
      </div>

      <div class="side-foot">
        <a class="foot-link" id="desktopStandalone" href="./fenjan/index.html" target="_blank" rel="noopener">
          <span>↗</span>
          <span class="side-foot-text">Open Standalone</span>
        </a>
      </div>
    </aside>

    <!-- Main Project Viewport -->
    <main class="stage">
      <div class="overlay-state visible" id="loaderOverlay">
        <div class="loader-pill">
          <span class="spinner"></span>
          <span id="loaderText">Loading project...</span>
        </div>
      </div>

      <div class="overlay-state" id="missingOverlay">
        <div class="missing-card">
          <h2 id="missingTitle">Folder Not Uploaded Yet</h2>
          <p id="missingBody"></p>
        </div>
      </div>

      <iframe
        id="projectFrame"
        class="frame"
        title="Automation Project Workspace"
        allow="clipboard-write"
      ></iframe>
    </main>
  </div>

  <script>
    const PROJECTS = [
      {
        id: 'hr',
        label: 'HR Automation Suite',
        short: 'HR',
        desc: 'Intake · AI Screening · RAG Policy',
        tag: '5 flows',
        src: './hr/index.html',
        folderHint: 'hr/index.html',
        subrouteMode: 'hash',
        theme: {
          sideBg: '#0b0b0e',
          sideElev: '#14141a',
          sideBorder: 'rgba(255, 77, 0, 0.28)',
          accent: '#ff4d00',
          accentSoft: 'rgba(255, 77, 0, 0.16)',
          accentGlow: 'rgba(255, 77, 0, 0.40)',
          iconBg: 'rgba(255, 77, 0, 0.18)',
          iconColor: '#ff6a2b'
        },
        subroutes: []
      },
      {
        id: 'dawaa',
        label: 'Dawaa Pharmacy',
        short: 'Rx',
        desc: 'WhatsApp · Gemini · Telegram · Sheets',
        tag: '2 flows',
        src: './dawaa/index.html',
        folderHint: 'dawaa/index.html',
        subrouteMode: 'hash',
        theme: {
          sideBg: '#08120e',
          sideElev: '#0f1f18',
          sideBorder: 'rgba(52, 211, 153, 0.24)',
          accent: '#34d399',
          accentSoft: 'rgba(52, 211, 153, 0.15)',
          accentGlow: 'rgba(52, 211, 153, 0.38)',
          iconBg: 'rgba(52, 211, 153, 0.18)',
          iconColor: '#34d399'
        },
        subroutes: [
          { id: 'home', label: 'Overview' },
          { id: 'counter', label: 'Live Counter' },
          { id: 'backoffice', label: 'Back Office' },
          { id: 'workflows', label: 'n8n Workflows' }
        ]
      },
      {
        id: 'fenjan',
        label: 'Fenjan Café',
        short: '☕',
        desc: 'Messenger · Instagram · Gemini · Kitchen',
        tag: '2 flows',
        src: './fenjan/index.html',
        folderHint: 'fenjan/index.html',
        subrouteMode: 'section',
        theme: {
          sideBg: '#12100e',
          sideElev: '#1c1814',
          sideBorder: 'rgba(60, 195, 181, 0.26)',
          accent: '#3cc3b5',
          accentSoft: 'rgba(60, 195, 181, 0.16)',
          accentGlow: 'rgba(60, 195, 181, 0.38)',
          iconBg: 'rgba(60, 195, 181, 0.16)',
          iconColor: '#3cc3b5'
        },
        subroutes: [
          { id: 'hero', label: 'Overview' },
          { id: 'demo', label: 'Try the Demo' },
          { id: 'how-it-works', label: 'How It Works' },
          { id: 'workflows', label: 'n8n Workflows' }
        ]
      }
    ];

    const shellEl = document.getElementById('shell');
    const sidebarEl = document.getElementById('sidebar');
    const backdropEl = document.getElementById('backdrop');
    const projectListEl = document.getElementById('projectList');
    const frameEl = document.getElementById('projectFrame');
    const loaderOverlay = document.getElementById('loaderOverlay');
    const loaderText = document.getElementById('loaderText');
    const missingOverlay = document.getElementById('missingOverlay');
    const missingTitle = document.getElementById('missingTitle');
    const missingBody = document.getElementById('missingBody');
    const mobileTitleEl = document.getElementById('mobileTitle');
    const desktopStandalone = document.getElementById('desktopStandalone');
    const mobileStandalone = document.getElementById('mobileStandalone');
    const collapseBtn = document.getElementById('collapseBtn');

    let currentProjectId = null;
    let currentSubroute = '';

    function applyTheme(theme) {
      const root = document.documentElement.style;
      root.setProperty('--side-bg', theme.sideBg);
      root.setProperty('--side-elev', theme.sideElev);
      root.setProperty('--side-border', theme.sideBorder);
      root.setProperty('--accent', theme.accent);
      root.setProperty('--accent-soft', theme.accentSoft);
      root.setProperty('--accent-glow', theme.accentGlow);
    }

    function openDrawer() {
      sidebarEl.classList.add('open');
      backdropEl.classList.add('open');
    }

    function closeDrawer() {
      sidebarEl.classList.remove('open');
      backdropEl.classList.remove('open');
    }

    document.getElementById('openDrawerBtn').addEventListener('click', openDrawer);
    document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
    backdropEl.addEventListener('click', closeDrawer);

    collapseBtn.addEventListener('click', () => {
      const collapsed = shellEl.classList.toggle('collapsed');
      collapseBtn.textContent = collapsed ? '»' : '«';
    });

    function renderSidebar() {
      projectListEl.innerHTML = '';
      PROJECTS.forEach((p) => {
        const isActive = p.id === currentProjectId;
        const group = document.createElement('div');
        group.className = 'proj-group' + (isActive ? ' active' : '');

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'proj-item' + (isActive ? ' active' : '');
        btn.title = p.label;
        btn.innerHTML = `
          <span class="proj-icon" style="background:${p.theme.iconBg}; color:${p.theme.iconColor}">${p.short}</span>
          <div class="proj-meta">
            <div class="proj-title-row">
              <span class="proj-name">${p.label}</span>
              <span class="proj-badge">${p.tag}</span>
            </div>
            <div class="proj-desc">${p.desc}</div>
          </div>
        `;
        btn.addEventListener('click', () => {
          const defaultSub = p.subroutes.length ? '/' + p.subroutes[0].id : '';
          window.location.hash = '#/' + p.id + defaultSub;
          closeDrawer();
        });
        group.appendChild(btn);

        if (p.subroutes && p.subroutes.length) {
          const sub = document.createElement('div');
          sub.className = 'subnav';
          p.subroutes.forEach((s) => {
            const sBtn = document.createElement('button');
            sBtn.type = 'button';
            const activeSub = isActive && ((currentSubroute || p.subroutes[0].id) === s.id);
            sBtn.className = 'subnav-btn' + (activeSub ? ' active' : '');
            sBtn.textContent = s.label;
            sBtn.addEventListener('click', () => {
              window.location.hash = `#/${p.id}/${s.id}`;
              closeDrawer();
            });
            sub.appendChild(sBtn);
          });
          group.appendChild(sub);
        }

        projectListEl.appendChild(group);
      });
    }

    function parseHash() {
      const raw = (window.location.hash || '').replace(/^#\/?/, '');
      const parts = raw.split('/').filter(Boolean);
      let projId = parts[0];
      let subroute = parts.slice(1).join('/');

      if (projId === 'project-3') projId = 'fenjan';
      if (['home', 'counter', 'backoffice'].includes(projId)) {
        subroute = projId;
        projId = 'dawaa';
      }

      const project = PROJECTS.find(p => p.id === projId) || PROJECTS[0];
      return { project, subroute };
    }

    function buildTargetUrl(project, subroute) {
      if (!subroute) return project.src;
      return project.subrouteMode === 'section'
        ? `${project.src}#${subroute}`
        : `${project.src}#/${subroute}`;
    }

    async function loadFromHash() {
      const { project, subroute } = parseHash();
      applyTheme(project.theme);
      document.title = `${project.label} — Abdelrahman Mohamed`;
      mobileTitleEl.textContent = project.label;

      const targetUrl = buildTargetUrl(project, subroute);
      desktopStandalone.href = targetUrl;
      mobileStandalone.href = targetUrl;

      const projectChanged = currentProjectId !== project.id;
      currentProjectId = project.id;
      currentSubroute = subroute || (project.subroutes[0]?.id || '');
      renderSidebar();

      missingOverlay.classList.remove('visible');

      if (!projectChanged && subroute && frameEl.contentWindow) {
        try {
          if (project.subrouteMode === 'section') {
            frameEl.contentWindow.postMessage({ type: 'fenjan-scroll', section: subroute }, '*');
          } else {
            frameEl.contentWindow.location.hash = '#/' + subroute;
          }
          return;
        } catch (_) {}
      }

      loaderText.textContent = `Loading ${project.label}...`;
      loaderOverlay.classList.add('visible');

      if (window.location.protocol.startsWith('http')) {
        try {
          const check = await fetch(project.src, { method: 'HEAD', cache: 'no-store' });
          if (check.status === 404) {
            loaderOverlay.classList.remove('visible');
            missingTitle.textContent = `${project.label} is not in /${project.id}/ yet`;
            missingBody.innerHTML = `Could not find <code>${project.folderHint}</code> in your repository.<br><br>Upload your ${project.label} files into the <code>${project.id}/</code> folder in <code>Automation-Suite</code> and refresh this page.`;
            missingOverlay.classList.add('visible');
            return;
          }
        } catch (_) {}
      }

      frameEl.src = targetUrl;
    }

    frameEl.addEventListener('load', () => {
      loaderOverlay.classList.remove('visible');
      if (currentProjectId === 'fenjan' && currentSubroute && currentSubroute !== 'hero') {
        try {
          frameEl.contentWindow.postMessage({ type: 'fenjan-scroll', section: currentSubroute }, '*');
        } catch (_) {}
      }
    });

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'dawaa-route' && currentProjectId === 'dawaa') {
        currentSubroute = e.data.route;
        const desiredHash = `#/dawaa/${currentSubroute}`;
        if (window.location.hash !== desiredHash) {
          history.replaceState(null, '', desiredHash);
        }
        desktopStandalone.href = `./dawaa/index.html#/${currentSubroute}`;
        mobileStandalone.href = `./dawaa/index.html#/${currentSubroute}`;
        renderSidebar();
      } else if (e.data && e.data.type === 'fenjan-section' && currentProjectId === 'fenjan') {
        if (currentSubroute !== e.data.section) {
          currentSubroute = e.data.section;
          renderSidebar();
        }
      }
    });

    window.addEventListener('hashchange', loadFromHash);
    if (!window.location.hash) {
      window.location.hash = '#/hr';
    } else {
      loadFromHash();
    }
  </script>
</body>
</html>
